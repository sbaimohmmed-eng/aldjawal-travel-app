name: aldjawal_travel_app
description: Smart Travel & Passport Index Platform - Compare passports, check visa requirements, and plan budgets.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  
  # HTTP & API
  dio: ^5.3.1
  
  # URL Launcher
  url_launcher: ^6.1.14
  
  # Stripe Payment
  flutter_stripe: ^10.1.0
  
  # State Management
  provider: ^6.0.0
  
  # Localization
  intl: ^0.19.0
  
  # JSON Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  lints: ^2.1.1
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  
  # Testing
  mockito: ^5.4.4
  test: ^1.24.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/locales/
    - assets/images/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
